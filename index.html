<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truco Soldado - Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1d13; }
        .title-font { font-family: 'Fredoka One', cursive; }
        .felt-table { background: radial-gradient(circle at center, #1e4d2b 0%, #0d2916 70%, #05140a 100%); box-shadow: inset 0 0 100px rgba(0,0,0,0.8); border: 12px solid #2d1806; }
        .card { transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover:not(.disabled) { transform: translateY(-10px) scale(1.05); box-shadow: 0 15px 25px rgba(0,0,0,0.6); z-index: 50; }
        .card-back { background: linear-gradient(135deg, #f472b6 0%, #db2777 100%); border: 2px solid #fbcfe8; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-1deg); } 50% { transform: translateX(5px) rotate(1deg); } 75% { transform: translateX(-5px) rotate(-1deg); } }
        .shake { animation: shake 0.4s infinite; }
        .blind-mask { filter: blur(4px) grayscale(100%); pointer-events: none; }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col justify-between p-2 sm:p-4">

    <header class="w-full max-w-6xl mx-auto flex justify-between items-center bg-emerald-950/80 p-3 rounded-2xl border border-emerald-800 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-pink-500 flex items-center justify-center text-2xl shadow-inner">🐷</div>
            <h1 class="text-2xl font-bold title-font text-yellow-400">TRUCO SOLDADO <span class="text-xs text-white bg-red-600 px-2 py-1 rounded ml-2">Master AI</span></h1>
        </div>
        <div class="flex space-x-2">
            <button onclick="engine.resetGame()" class="px-4 py-2 bg-red-700 hover:bg-red-600 rounded-lg font-bold shadow transition">Reiniciar</button>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto my-2 flex-grow flex flex-col justify-center items-center">
        <div class="felt-table w-full aspect-[4/3] max-h-[620px] rounded-[40px] relative flex flex-col justify-between p-4 overflow-hidden">
            
            <!-- Badge Escura -->
            <div id="escura-badge" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-purple-900 text-purple-200 border-2 border-purple-400 px-4 py-1 rounded-full text-sm font-bold uppercase shadow-lg z-20">
                Modo Escuro Ativado
            </div>

            <!-- IAs -->
            <div id="player-1-area" class="absolute top-8 left-12 flex flex-col items-center z-10">
                <div id="avatar-1" class="w-16 h-16 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center text-3xl shadow-lg">🐗</div>
                <span class="font-bold text-sm mt-1">Porco 2 (IA)</span>
                <div class="bg-black/50 px-3 py-1 rounded-full text-xs mt-1 border border-white/10">
                    Tentos: <span id="score-1" class="text-yellow-400 font-bold">0</span>/12
                </div>
                <div id="hand-1" class="flex -space-x-4 mt-2"></div>
            </div>

            <div id="player-2-area" class="absolute top-8 right-12 flex flex-col items-center z-10">
                <div id="avatar-2" class="w-16 h-16 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center text-3xl shadow-lg">🐷</div>
                <span class="font-bold text-sm mt-1">Porco 3 (IA)</span>
                <div class="bg-black/50 px-3 py-1 rounded-full text-xs mt-1 border border-white/10">
                    Tentos: <span id="score-2" class="text-yellow-400 font-bold">0</span>/12
                </div>
                <div id="hand-2" class="flex -space-x-4 mt-2"></div>
            </div>

            <!-- Centro -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="absolute left-[30%] flex items-center -space-x-6 pointer-events-auto">
                    <div class="w-12 h-20 card-back rounded-lg flex items-center justify-center text-xl shadow-2xl transform -rotate-6">🐷</div>
                    <div id="vira-display" class="w-12 h-20 bg-white rounded-lg border-2 border-amber-400 flex flex-col justify-between p-1 shadow-2xl transform rotate-90 translate-x-4">
                        <span id="vira-rank" class="text-xs font-bold text-red-600"></span>
                        <span id="vira-suit" class="text-center text-xl text-red-600"></span>
                        <span class="text-xs font-bold text-red-600 text-right"></span>
                    </div>
                </div>

                <div class="relative w-64 h-64 flex items-center justify-center">
                    <div id="trick-badge" class="absolute top-0 bg-emerald-900/90 border border-emerald-500 text-yellow-300 text-xs font-bold px-3 py-1 rounded-full">VAZA 1: VALE 3 TENTOS</div>
                    
                    <div id="played-0" class="absolute bottom-4"></div>
                    <div id="played-1" class="absolute top-8 left-0"></div>
                    <div id="played-2" class="absolute top-8 right-0"></div>
                </div>
            </div>

            <!-- Humano -->
            <div id="player-0-area" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex flex-col items-center z-20">
                <div id="hand-0" class="flex -space-x-3 mb-2 pointer-events-auto"></div>
                <div class="flex items-center gap-4 bg-slate-900/90 border-2 border-emerald-500/50 px-6 py-2 rounded-2xl shadow-xl">
                    <div class="w-12 h-12 rounded-full bg-emerald-700 border-2 border-emerald-400 flex items-center justify-center text-2xl">👑</div>
                    <div>
                        <div class="font-bold text-sm text-yellow-300">Porco 1 (Você)</div>
                        <div class="text-xs text-slate-300">
                            Tentos: <span id="score-0" class="text-yellow-400 font-bold text-base">0</span>/12 | 
                            Estouros: <span id="resets-0" class="text-red-400 font-bold">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-6xl mx-auto flex gap-4">
        <div id="game-log" class="flex-grow bg-emerald-950/90 border border-emerald-800 rounded-xl p-3 h-24 overflow-y-auto text-sm font-mono text-emerald-200 shadow-inner">
            <div class="text-emerald-400 font-bold mb-1">> Log do Sistema:</div>
        </div>
        <button id="btn-next-hand" onclick="engine.startNewHand()" class="w-48 bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 font-black text-lg rounded-xl shadow-lg border-2 border-yellow-300 flex items-center justify-center transition hover:scale-105">
            NOVA MÃO
        </button>
    </footer>

    <!-- Overlay Castigo -->
    <div id="slap-overlay" class="fixed inset-0 bg-red-950/90 z-50 flex flex-col items-center justify-center hidden">
        <div class="text-center p-8 bg-black/80 border-4 border-red-600 rounded-3xl shadow-2xl relative">
            <div class="text-8xl mb-4 shake">👋🐮</div>
            <h1 class="text-4xl font-extrabold title-font text-red-500 mb-2">TAPA NA VACA!</h1>
            <p id="slap-target" class="text-xl text-yellow-300 font-bold mb-6"></p>
            <button onclick="engine.closeSlap()" class="px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-black text-lg rounded-xl">Continuar</button>
        </div>
    </div>

    <!-- Overlay Vitoria -->
    <div id="victory-overlay" class="fixed inset-0 bg-black/90 z-40 flex flex-col items-center justify-center hidden">
        <div class="text-center p-8 bg-emerald-950 border-4 border-yellow-400 rounded-3xl shadow-2xl">
            <div class="text-7xl mb-2">🏆</div>
            <h2 id="victory-title" class="text-3xl font-black title-font text-yellow-400">VENCEDOR!</h2>
            <button onclick="engine.resetGame()" class="mt-6 px-8 py-3 bg-yellow-500 text-slate-950 font-black rounded-xl">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
